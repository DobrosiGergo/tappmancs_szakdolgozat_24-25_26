name: Deploy

# A droplet húzza be a kódot SSH-n keresztül. Az asseteket a runner buildeli,
# és rsync-kel másoljuk fel: a $6-os droplet 1 GB RAM-ján a Vite build
# elfogyaszthatja a memóriát, és egy OOM a deploy közepén állítja meg a
# folyamatot.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed:
        description: 'Run db:seed and demo:reset as well (fresh database only)'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # A repo npm workspaces monorepo (gyoker package.json -> app, app-e2e),
      # ezert a telepites a gyokerben fut: minden workspace fuggosege a gyoker
      # node_modules-aba hoistolodik, az app/package-lock.json mar nem hasznalt.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # A gyoker lockfile win32-on keszult, es csak a win32 nativ binarisokat
      # rogziti (@esbuild/win32-x64, @rollup/rollup-win32-*), az npm pedig nem
      # tolti be utolag a hianyzo opcionalis fuggosegeket (npm/cli#4828). Ezert
      # a linuxos runneren kezzel huzzuk be a nativ csomagokat, pontosan a mar
      # telepitett verzioval, hogy a build ne terjen el a lockfile-tol.
      # Ha a gyoker lockfile ujrageneralasra kerul, ez a lepes torolheto.
      - name: Install linux-native build binaries
        run: |
          set -e
          pkgs=()
          for mod in rollup:@rollup/rollup-linux-x64-gnu esbuild:@esbuild/linux-x64; do
            name="${mod%%:*}"
            native="${mod#*:}"
            version="$(node -p "require('$name/package.json').version" 2>/dev/null || true)"
            if [ -n "$version" ]; then
              pkgs+=("$native@$version")
            fi
          done
          if [ ${#pkgs[@]} -gt 0 ]; then
            echo "Telepites: ${pkgs[*]}"
            npm install --no-save --no-audit --no-fund "${pkgs[@]}"
          fi

      - name: Build frontend assets
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: app/public/build
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull code and install dependencies
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            cd /var/www/tappmancs
            git fetch --all
            git reset --hard origin/main
            cd app
            composer install --no-dev --optimize-autoloader --no-interaction
          '

      - name: Upload built assets
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" \
            build/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/tappmancs/app/public/build/"

      - name: Migrate and warm caches
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            cd /var/www/tappmancs/app
            php artisan migrate --force
            php artisan storage:link || true
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            sudo systemctl reload php8.4-fpm
          '

      - name: Seed and reset demo data
        if: github.event_name == 'workflow_dispatch' && inputs.seed
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            cd /var/www/tappmancs/app
            php artisan db:seed --force
            php artisan demo:reset
          '
