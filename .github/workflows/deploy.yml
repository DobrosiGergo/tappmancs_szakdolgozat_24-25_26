name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed:
        description: 'Run db:seed and demo:reset as well (fresh database only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SSH_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
  APP_ROOT: /var/www/tappmancs

jobs:
  build:
    name: Build assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install linux-native build binaries
        run: |
          set -e
          pkgs=()
          for mod in rollup:@rollup/rollup-linux-x64-gnu esbuild:@esbuild/linux-x64; do
            name="${mod%%:*}"
            native="${mod#*:}"
            version="$(node -p "require('$name/package.json').version" 2>/dev/null || true)"
            if [ -n "$version" ]; then
              pkgs+=("$native@$version")
            fi
          done
          if [ ${#pkgs[@]} -gt 0 ]; then
            echo "Telepites: ${pkgs[*]}"
            npm install --no-save --no-audit --no-fund "${pkgs[@]}"
          fi

      - name: Build frontend assets
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: app/public/build
          retention-days: 1

  test:
    name: Run tests
    needs: build
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: tappmancs_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: pdo_mysql, mbstring, intl, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/download-artifact@v4
        with:
          name: build
          path: app/public/build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Pest
        run: ./vendor/bin/pest

  code:
    name: Pull code
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Reset to origin/main
        run: |
          ssh "$SSH_TARGET" "
            set -e
            cd $APP_ROOT
            git fetch --all
            git reset --hard origin/main
          "

      - name: Install Composer dependencies
        run: |
          ssh "$SSH_TARGET" "
            set -e
            cd $APP_ROOT/app
            composer install --no-dev --optimize-autoloader --no-interaction
          "

  assets:
    name: Upload assets
    needs: code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload built assets
        run: rsync -az --delete build/ "$SSH_TARGET:$APP_ROOT/app/public/build/"

  migrate:
    name: Migrate and cache
    needs: assets
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Run migrations
        run: |
          ssh "$SSH_TARGET" "
            set -e
            cd $APP_ROOT/app
            php artisan migrate --force
            php artisan storage:link || true
          "

      - name: Rebuild caches
        run: |
          ssh "$SSH_TARGET" "
            set -e
            cd $APP_ROOT/app
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
          "

      - name: Reload PHP-FPM
        run: ssh "$SSH_TARGET" "sudo systemctl reload php8.5-fpm"

  seed:
    name: Seed demo data
    needs: migrate
    if: github.event_name == 'workflow_dispatch' && inputs.seed
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Seed and reset demo data
        run: |
          ssh "$SSH_TARGET" "
            set -e
            cd $APP_ROOT/app
            php artisan db:seed --force
            php artisan demo:reset --force
          "
