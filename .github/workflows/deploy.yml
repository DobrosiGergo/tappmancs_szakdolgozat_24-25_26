name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed:
        description: 'Run db:seed and demo:reset as well (fresh database only)'
        type: boolean
        default: false

# A jobok csak olvassák a repót; a droplethez az SSH-kulcs ad hozzáférést.
permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SSH_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
  APP_ROOT: /var/www/tappmancs

jobs:
  build:
    name: Build assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # A repo npm workspaces monorepo (gyoker package.json -> app, app-e2e),
      # ezert a telepites a gyokerben fut: minden workspace fuggosege a gyoker
      # node_modules-aba hoistolodik, az app/package-lock.json mar nem hasznalt.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # A gyoker lockfile win32-on keszult, es csak a win32 nativ binarisokat
      # rogziti (@esbuild/win32-x64, @rollup/rollup-win32-*), az npm pedig nem
      # tolti be utolag a hianyzo opcionalis fuggosegeket (npm/cli#4828). Ezert
      # a linuxos runneren kezzel huzzuk be a nativ csomagokat, pontosan a mar
      # telepitett verzioval, hogy a build ne terjen el a lockfile-tol.
      # Ha a gyoker lockfile ujrageneralasra kerul, ez a lepes torolheto.
      - name: Install linux-native build binaries
        run: |
          set -e
          pkgs=()
          for mod in rollup:@rollup/rollup-linux-x64-gnu esbuild:@esbuild/linux-x64; do
            name="${mod%%:*}"
            native="${mod#*:}"
            version="$(node -p "require('$name/package.json').version" 2>/dev/null || true)"
            if [ -n "$version" ]; then
              pkgs+=("$native@$version")
            fi
          done
          if [ ${#pkgs[@]} -gt 0 ]; then
            echo "Telepites: ${pkgs[*]}"
            npm install --no-save --no-audit --no-fund "${pkgs[@]}"
          fi

      - name: Build frontend assets
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: app/public/build
          retention-days: 1

  # A Pest tesztek (Unit + Feature) kapuzzák a deployt: ha egy is elhasal, a
  # droplethez egyik későbbi job sem nyúl. Az e2e tesztek szándékosan nincsenek
  # itt, mert azok a már kihelyezett oldal ellen futnak (npm run test:e2e:prod).
  test:
    name: Run tests
    needs: build
    runs-on: ubuntu-latest
    # Ugyanaz a MySQL főverzió, mint a dropleten. A phpunit.xml a
    # tappmancs_test adatbázisra irányítja a teszteket.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: tappmancs_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # Ugyanaz a PHP, mint a dropleten (php8.5-fpm).
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: pdo_mysql, mbstring, intl, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # A Feature tesztek nézeteket renderelnek, a @vite direktíva pedig a
      # manifestet keresi, ezért kell a build job eredménye.
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: app/public/build

      # A .env.example kapcsolati adatai (127.0.0.1:3306, root, jelszó nélkül)
      # a MySQL service-re mutatnak, az adatbázis nevét a phpunit.xml adja.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Pest
        run: ./vendor/bin/pest

  code:
    name: Pull code
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Reset to origin/main
        run: |
          ssh "$SSH_TARGET" "
            set -e
            cd $APP_ROOT
            git fetch --all
            git reset --hard origin/main
          "

      - name: Install Composer dependencies
        run: |
          ssh "$SSH_TARGET" "
            set -e
            cd $APP_ROOT/app
            composer install --no-dev --optimize-autoloader --no-interaction
          "

  assets:
    name: Upload assets
    needs: code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload built assets
        run: rsync -az --delete build/ "$SSH_TARGET:$APP_ROOT/app/public/build/"

  migrate:
    name: Migrate and cache
    needs: assets
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Run migrations
        run: |
          ssh "$SSH_TARGET" "
            set -e
            cd $APP_ROOT/app
            php artisan migrate --force
            php artisan storage:link || true
          "

      - name: Rebuild caches
        run: |
          ssh "$SSH_TARGET" "
            set -e
            cd $APP_ROOT/app
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
          "

      - name: Reload PHP-FPM
        run: ssh "$SSH_TARGET" "sudo systemctl reload php8.5-fpm"

  # Push-ra kimarad (a gráfon "skipped"), csak kézi indításnál, seed: true mellett fut.
  seed:
    name: Seed demo data
    needs: migrate
    if: github.event_name == 'workflow_dispatch' && inputs.seed
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      # A --force kell: a demo:reset production alatt megerősítést kér, az
      # SSH-munkamenetnek pedig nincs terminálja, ahol válaszolni lehetne.
      - name: Seed and reset demo data
        run: |
          ssh "$SSH_TARGET" "
            set -e
            cd $APP_ROOT/app
            php artisan db:seed --force
            php artisan demo:reset --force
          "
