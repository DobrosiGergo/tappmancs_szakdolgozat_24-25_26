name: Deploy

# Az alkalmazást a Vercel Git-integrációja deployolja automatikusan minden
# main-re érkező pushnál. Ez a workflow csak azt végzi el, amit a serverless
# runtime nem tud: az adatbázis-migrációt a Neon Postgres ellen.
#
# A seedelés szándékos, kézi művelet (workflow_dispatch), hogy egy push ne
# írhassa újra az éles adatokat.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed:
        description: 'Run db:seed and demo:reset as well (fresh database only)'
        type: boolean
        default: false

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    env:
      APP_ENV: production
      APP_KEY: ${{ secrets.APP_KEY }}
      APP_DEBUG: 'false'
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_DATABASE: ${{ secrets.DB_DATABASE }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_SSLMODE: require
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring, bcmath
          coverage: none

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Run migrations
        run: php artisan migrate --force

      - name: Seed and reset demo data
        if: github.event_name == 'workflow_dispatch' && inputs.seed
        run: |
          php artisan db:seed --force
          php artisan demo:reset
